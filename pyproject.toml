[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-turtle-face-detection"
version = "0.1.0"
description = "Educational pipeline for sea turtle face bounding-box detection."
requires-python = ">=3.11,<3.12"
dependencies = [
    "ImageHash==4.3.2",
    "ipykernel==7.3.0",
    "jupyterlab==4.6.0",
    "matplotlib==3.11.1",
    "numpy==2.3.5",
    "pandas==3.0.3",
    "pillow==12.3.0",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
